<style>
.ficha-hud{--c:#00ffe1;--g:#39ff14;--m:#ff00e6;--h:#39ff14;--o:.5;position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:flex-end;padding:16px;box-sizing:border-box;font-family:Consolas,"Courier New",monospace;text-shadow:0 0 5px}
.ficha-hud[hidden]{display:none}
.ficha-hud,.ficha-hud *{pointer-events:none;user-select:none}
.hud-panel{width:min(92vw,460px);max-height:min(86vh,640px);display:flex;flex-direction:column;background:#000;border:2px solid var(--c);border-radius:6px;color:var(--g);box-shadow:0 0 12px #00ffe18c,0 0 36px #00ffe140,inset 0 0 18px #00ffe11f;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;scale:.94;translate:0 8px}}
@keyframes blink{to{visibility:hidden}}
.hud-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#06222a;border-bottom:1px solid var(--c)}
.hud-bar i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--m)}
.hud-bar i:nth-child(2){background:#ffe600}.hud-bar i:nth-child(3){background:var(--c)}
.hud-title{flex:1;min-width:0;margin-left:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(12px,2.6vw,14px);letter-spacing:.08em;color:var(--c)}
.hud-alert{font-size:clamp(10px,2.2vw,12px);letter-spacing:.06em;color:var(--m)}
.hud-body{padding:14px 16px;overflow-y:auto;font-size:clamp(13px,3vw,15px);line-height:1.55}
.hud-body dl{margin:0}.hud-row{margin:0 0 8px}
.hud-row dt{display:inline;color:var(--c)}.hud-row dt::after{content:": "}
.hud-row dd{display:inline;margin:0}
.hud-foot{display:flex;justify-content:flex-end;padding:10px 16px 14px;border-top:1px solid #00ffe159}
.hud-btn{position:relative;overflow:hidden;min-width:170px;padding:9px 26px;text-align:center;color:var(--c);background:#000;border:2px solid var(--c);border-radius:4px;box-shadow:0 0 10px #00ffe173;transition:box-shadow .15s,border-color .15s}
.hud-btn::before{content:"";position:absolute;inset:0;background:var(--c);opacity:var(--o);transform-origin:left;transform:scaleX(var(--p,0))}
.hud-btn span{position:relative;display:block}
.hud-btn .l{font-size:16px;letter-spacing:.14em}.hud-btn .s{font-size:10px;letter-spacing:.06em;opacity:.75}
.mirando .hud-btn{border-color:var(--h);box-shadow:0 0 20px #39ff14bf}
.hud-reticle{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--m);border-radius:50%;box-shadow:0 0 8px var(--m),inset 0 0 6px var(--m);will-change:transform}
.hud-reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--m)}
.mirando .hud-reticle{--m:var(--h)}
.terminal{justify-content:center}
.terminal .hud-panel{width:min(94vw,560px);border-radius:3px;background:repeating-linear-gradient(0deg,#39ff140b 0 1px,transparent 1px 3px),#000}
.terminal .hud-bar{gap:12px;background:#021a12;border-bottom-color:var(--g)}
.terminal .hud-title{margin:0;font-size:clamp(10px,2.3vw,12px);letter-spacing:.05em;color:var(--g)}
.terminal .hud-alert{font-size:12px;letter-spacing:.15em;color:var(--c)}
.terminal h2{margin:0 0 4px;padding:6px 0 8px;text-align:center;font-size:clamp(18px,5vw,26px);font-weight:400;letter-spacing:.22em;text-shadow:0 0 8px,0 0 22px;border-bottom:1px solid #39ff1473}
.terminal p{margin:0 0 10px;font-size:clamp(11px,2.6vw,13px);letter-spacing:.05em}
.terminal .f{margin:10px 0 2px;font-size:clamp(14px,3.4vw,17px);letter-spacing:.12em;color:var(--c)}
.terminal .f::before{content:"> ";color:var(--g)}
.terminal b{margin-left:2px;padding:1px 6px;font-weight:400;color:#ff2a6d;border:1px solid;box-shadow:0 0 8px;animation:blink 1.1s steps(2,start) infinite}
.terminal dt,.terminal dd,.terminal dd span{display:block}
.terminal dt{font-size:.82em;letter-spacing:.14em}
.terminal dd span::before{content:"▸ ";color:#ff2a6d}
.terminal blockquote{margin:12px 0 0;padding:8px 0 2px 12px;font-style:italic;color:#9dffb0;border-left:2px solid var(--c)}
.terminal blockquote i{display:inline-block;width:.6em;height:1em;margin-left:4px;vertical-align:text-bottom;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink 1s steps(2,start) infinite}
.papel{--c:#1d2b4f;--g:#1d2b4f;--m:#d1121f;--h:#1b8a2e;--o:.26;justify-content:center;text-shadow:0 0 1px;font-family:"Caveat","Segoe Script","Bradley Hand","Brush Script MT",cursive}
.papel .hud-panel{position:relative;isolation:isolate;width:min(92vw,440px);max-height:min(86vh,600px);background:none;border:0;border-radius:0;box-shadow:none;transform:rotate(-1.2deg);filter:drop-shadow(0 10px 18px #000000a6)}
.papel .hud-panel::before{content:"";position:absolute;top:-13px;left:50%;width:112px;height:28px;margin-left:-56px;z-index:2;transform:rotate(2.5deg);background:linear-gradient(90deg,#ece0b0cc,#decf96b8);box-shadow:0 1px 3px #00000059}
.papel .hud-panel::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 49.4%,#502d0a38 50%,#fff5d238 50.7%,transparent 51.4%),linear-gradient(90deg,transparent 66.4%,#502d0a24 67%,#fff5d229 67.6%,transparent 68.2%),radial-gradient(circle at 82% 86%,transparent 34px,#6e3c0f4d 35px 38px,transparent 41px),radial-gradient(ellipse at 18% 14%,#7d4b1638,transparent 46%),radial-gradient(ellipse at 88% 78%,#64370f47,transparent 52%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .08 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(170deg,#ecdaa8,#d9bf84);box-shadow:inset 0 0 70px #78410f8c,inset 0 0 14px #462305a6;clip-path:polygon(0 1%,5% 0,12% 1%,22% 0,34% 1%,46% 0,58% 1%,70% 0,82% 1%,92% 0,100% 1%,99% 14%,100% 30%,99% 48%,100% 66%,99% 84%,100% 100%,90% 99%,78% 100%,64% 99%,50% 100%,36% 99%,22% 100%,10% 99%,0 100%,1% 82%,0 62%,1% 40%,0 20%)}
.papel .hud-body{padding:30px 30px 8px;font-size:clamp(21px,5.4vw,27px);line-height:1.38;font-weight:500}
.papel p{margin:0;transform:rotate(.4deg)}
.papel u{text-decoration:underline wavy #8b1a1a;text-underline-offset:4px}
.papel .hud-foot{margin:0 14px;padding:10px 28px 20px;border-top:1px dashed #1d2b4f59}
.papel .hud-btn{min-width:150px;padding:5px 22px 6px;background:none;box-shadow:none;transform:rotate(-1deg);border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.papel .hud-btn .l{font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1.1}
.papel .hud-btn .s{font-size:15px;letter-spacing:.02em;opacity:.8;text-transform:lowercase}
.papel.mirando .hud-btn{color:#8b1a1a;border-color:#8b1a1a;box-shadow:none}
.papel .hud-reticle{box-shadow:0 0 0 2px #fffc,0 0 8px #0009}
@media(max-width:600px){.ficha-hud{align-items:flex-end;justify-content:center;padding:10px}.hud-panel{max-height:62vh}.terminal .hud-panel{max-height:74vh}.papel .hud-panel{max-height:78vh}.papel .hud-body{padding:26px 22px 6px}}
@media(prefers-reduced-motion:reduce){.ficha-hud *{animation:none!important}}
</style>
<script>
const T=1500,G=1.5,VOL=.2; // ms mirando LISTO · sensibilidad de la mira · volumen (0 a 1)

/* AUDIO DE FONDO */
const musica=new Audio('./assets/freesound_community-intro-microbrute-1-28282.mp3');
musica.loop=true;musica.volume=0;
const ev=['pointerdown','keydown','touchstart'];
const play=()=>musica.play().then(()=>{ev.forEach(e=>removeEventListener(e,play));const t0=performance.now();(function f(){const p=Math.min((performance.now()-t0)/4000,1);musica.volume=VOL*p;p<1&&requestAnimationFrame(f)})()}).catch(()=>{});
ev.forEach(e=>addEventListener(e,play));play();
document.addEventListener('visibilitychange',()=>document.hidden?musica.pause():musica.currentTime&&musica.play().catch(()=>{}));

/* FICHAS: aquí se edita el texto */
const dl=f=>`<dl>${f.map(([k,v])=>`<div class="hud-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const barra=t=>`<div class="hud-bar"><i></i><i></i><i></i><span class="hud-title">${t}</span><span class="hud-alert">ALERTA B.O.W.</span></div>`;
const FICHAS={
u3:{barra:barra('U-3 // FICHA TÉCNICA'),cuerpo:dl([['Nombre','U-3 (Ultimate Three)'],['Clasificación','Arma biológica experimental (B.O.W.)'],['Origen','Isla controlada por Los Iluminados.'],['Infección','Las Plagas (parásito, no virus T).'],['Anatomía','Híbrido con rasgos humanos, reptilianos e insectoides.'],['Habilidades','Fuerza elevada, garras, lengua extensible y ataques parasitarios.'],['Debilidad','Estructuras parasitarias expuestas.'],['Comportamiento','Agresivo y hostil.']])},
mutante:{barra:barra('MUTANTE // FICHA TÉCNICA'),cuerpo:dl([['Nombre','Mutante experimental (sin identificar).'],['Clasificación','Arma biológica (B.O.W.).'],['Anatomía','Humanoide, musculatura robusta y extremidades deformadas.'],['Rasgos distintivos','Apéndices alargados, garras afiladas y protuberancias orgánicas.'],['Capacidades','Fuerza física elevada y ataques con extremidades modificadas.'],['Comportamiento','Hostil y agresivo.'],['Estado','Mutación biológica avanzada.']])},
umbrella:{clase:'terminal',barra:'<div class="hud-bar"><span class="hud-title">C:\\UMBRELLA\\ARCHIVOS\\00-1998.DAT</span><span class="hud-alert">[ _ ][ ■ ][ X ]</span></div>',
cuerpo:`<h2>UMBRELLA CORPORATION</h2><p class="f">ARCHIVO 00-1998</p><p>DIVISIÓN DE ARMAMENTO BIOLÓGICO · <b>¡ACCESO RESTRINGIDO!</b></p>`+dl([['ASUNTO','Desarrollo ilegal de organismos biológicos.'],['ESTADO','Información parcialmente censurada.'],['ORDEN',['Recuperar las muestras.','Eliminar evidencias.','Silenciar a los testigos.'].map(o=>`<span>${o}</span>`).join('')]])+`<blockquote>«La investigación nunca fue diseñada para salvar vidas. Fue diseñada para decidir quién tendría el poder de controlarlas».<i></i></blockquote>`},
hongos:{clase:'papel',cuerpo:`<p>A diferencia de los zombis comunes que pierden la cabeza de inmediato al morir, este virus trabaja mutando el cuerpo mientras la víctima sigue viva y consciente durante las primeras fases de la infección. El objetivo del patógeno es hacer que las personas alcancen su <u>máximo potencial</u></p>`}};

/* uso: ficha-popup="u3" · HUD local por visitante, una ficha a la vez */
let activo=null;
AFRAME.registerComponent('ficha-popup',{
schema:{type:'string'},
init(){
 const f=FICHAS[this.data],h=this.hud=document.createElement('div');
 h.className='ficha-hud '+(f.clase||'');h.hidden=true;
 h.innerHTML=`<section class="hud-panel" role="dialog" aria-label="Ficha informativa">${f.barra||''}<div class="hud-body">${f.cuerpo}</div><footer class="hud-foot"><div class="hud-btn"><span class="l">LISTO</span><span class="s">MANTÉN LA MIRADA</span></div></footer></section><div class="hud-reticle"></div>`;
 document.body.appendChild(h);
 this.btn=h.querySelector('.hud-btn');this.mira=h.querySelector('.hud-reticle');
 this.cur=this.el.sceneEl.querySelector('a-cursor');this.dir=new AFRAME.THREE.Vector3();
 this.abierto=this.sobre=this.bloq=false;this.rect=null;this.t0=0;
 this.onEnter=()=>{this.sobre=true;!this.abierto&&!this.bloq&&!activo&&this.abrir()};
 this.onLeave=()=>{this.sobre=this.bloq=false};
 this.onKey=e=>e.key==='Escape'&&this.abierto&&this.cerrar();
 this.inv=()=>{this.rect=null};
 this.el.addEventListener('mouseenter',this.onEnter);this.el.addEventListener('mouseleave',this.onLeave);
 addEventListener('keydown',this.onKey);addEventListener('resize',this.inv);h.addEventListener('animationend',this.inv);
},
leer(){const d=this.dir,R=180/Math.PI;this.el.sceneEl.camera.getWorldDirection(d);this.yaw=Math.atan2(-d.x,-d.z)*R;this.pitch=Math.asin(Math.max(-1,Math.min(1,d.y)))*R},
reset(){this.t0=0;this.hud.classList.remove('mirando');this.btn.style.setProperty('--p',0)},
abrir(){this.leer();this.yaw0=this.yaw;this.pitch0=this.pitch;activo=this;this.abierto=true;this.rect=null;this.hud.hidden=false;this.mover(innerWidth/2,innerHeight/2);this.reset();this.cur&&this.cur.setAttribute('visible',false)},
cerrar(){if(!this.abierto)return;this.abierto=false;activo=null;this.hud.hidden=true;this.reset();this.cur&&this.cur.setAttribute('visible',true);this.bloq=this.sobre},
mover(x,y){this.mira.style.transform=`translate(${x}px,${y}px)`},
tick(){
 if(!this.abierto)return;this.leer();
 const W=innerWidth,H=innerHeight,ppd=H/(this.el.sceneEl.camera.fov||80)*G;
 const x=Math.max(0,Math.min(W,W/2-((this.yaw-this.yaw0+540)%360-180)*ppd));
 const y=Math.max(0,Math.min(H,H/2-(this.pitch-this.pitch0)*ppd));
 this.mover(x,y);
 const b=this.rect||(this.rect=this.btn.getBoundingClientRect()),m=4;
 const dentro=x>=b.left-m&&x<=b.right+m&&y>=b.top-m&&y<=b.bottom+m;
 this.hud.classList.toggle('mirando',dentro);
 if(!dentro){this.t0&&this.reset();return}
 this.t0=this.t0||performance.now();
 const p=Math.min((performance.now()-this.t0)/T,1);
 this.btn.style.setProperty('--p',p);p>=1&&this.cerrar();
},
remove(){activo===this&&(activo=null);this.el.removeEventListener('mouseenter',this.onEnter);this.el.removeEventListener('mouseleave',this.onLeave);removeEventListener('keydown',this.onKey);removeEventListener('resize',this.inv);this.hud.remove()}
});
</script>
